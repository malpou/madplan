$schema: https://json-schema.org/draft/2020-12/schema
$id: seasonal.schema.yaml
title: Seasonal produce calendar
type: object
additionalProperties: false
required: [region, produce, off_season_fallbacks]
properties:
  region: {type: string}
  note: {type: string}
  produce:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name_da, name_en, type, months]
      properties:
        name_da: {type: string}
        name_en: {type: string}
        type: {type: string, enum: [vegetable, fruit, herb, mushroom]}
        months:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: defs.schema.yaml#/$defs/month}
        storage_crop: {type: boolean, description: Available from Danish storage outside harvest}
  off_season_fallbacks:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [item, form]
      properties:
        item: {type: string}
        form: {type: string, enum: [frozen, canned, jarred, dried]}
