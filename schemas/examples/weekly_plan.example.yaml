    prep: Blitz in food processor, roll, keep chilled up to 7 days.
    ingredients:
      - {name: oats, quantity: 150, unit: g}
      - {name: dates, quantity: 200, unit: g}
      - {name: peanut butter, quantity: 3, unit: tbsp}
  - name: Skyr recovery smoothie
    purpose: recovery
    prep: Blend after training.
    ingredients:
      - {name: skyr, quantity: 1000, unit: g}
      - {name: frozen berries, quantity: 500, unit: g}
      - {name: bananas, quantity: 6, unit: pcs}
