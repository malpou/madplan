cook_sessions:
  - id: s1
    day: mon
    est_minutes: 100
    dishes: [squash_chickpea_curry, roast_veg_tray]
    prep_order:
      - Oven to 200°C; cube squash, carrots and onions.
      - Roast tray veg (40 min); start rice.
      - Make curry base while veg roasts.
      - Portion into boxes; cool before fridge.
  - id: s2
    day: thu
    est_minutes: 90
    dishes: [lentil_mushroom_ragu]
    prep_order:
      - Soak/rinse lentils; dice mushrooms, leek, carrot.
      - Simmer ragù 45 min; cook pasta for tonight only.
      - Freeze 2 portions.

dishes:
  - id: squash_chickpea_curry
    name: Mild hokkaido & chickpea curry with rice
    cuisine: asian
    new: false
    source: {type: cookbook, source_id: east, adapted: "Milder, added tofu for protein"}
    servings: 4
    protein_g_per_serving: 32
    fridge_days: 4
    freezes: true
    side_on_the_side: [chili flakes]
    ingredients:
      - {name: hokkaido squash, quantity: 1, unit: pcs}
      - {name: chickpeas, quantity: 2, unit: can}
      - {name: coconut milk (light), quantity: 1, unit: can}
      - {name: firm tofu, quantity: 400, unit: g}
      - {name: onion, quantity: 2, unit: pcs}
      - {name: kale, quantity: 150, unit: g}
      - {name: curry powder (mild), quantity: 2, unit: tbsp}
      - {name: rice, quantity: 300, unit: g}
    steps:
      - Fry onion and curry powder in oil 5 min.
      - Add squash, chickpeas, coconut milk; simmer 20 min.
      - Add cubed tofu and chopped kale last 5 min.
      - Serve with rice; chili on the side.
  - id: roast_veg_tray
    name: Roast root veg & halloumi bowls with yogurt-tahini
    cuisine: mediterranean_middle_eastern
    new: true
    source: {type: website, source_id: love_and_lemons, url: "https://www.loveandlemons.com", adapted: Swapped yogurt for skyr}
    servings: 2
    protein_g_per_serving: 34
    fridge_days: 3
    freezes: false
    ingredients:
      - {name: carrots, quantity: 500, unit: g}
      - {name: red onion, quantity: 2, unit: pcs}
      - {name: halloumi, quantity: 225, unit: g}
      - {name: skyr, quantity: 200, unit: g}
      - {name: tahini, quantity: 2, unit: tbsp}
      - {name: bulgur, quantity: 150, unit: g}
    steps:
      - Roast veg at 200°C for 40 min.
      - Fry halloumi slices on the night of eating.
      - Mix skyr, tahini, lemon, salt; serve over bulgur.
  - id: lentil_mushroom_ragu
    name: Lentil & mushroom ragù with pasta
    cuisine: nordic_comfort
    new: false
    servings: 4
    protein_g_per_serving: 30
    fridge_days: 4
    freezes: true
    ingredients:
      - {name: green lentils (dried), quantity: 250, unit: g}
      - {name: mushrooms, quantity: 400, unit: g}
      - {name: leek, quantity: 1, unit: pcs}
      - {name: carrots, quantity: 2, unit: pcs}
      - {name: chopped tomatoes, quantity: 2, unit: can}
      - {name: pasta, quantity: 400, unit: g}
      - {name: parmesan-style cheese, quantity: 60, unit: g}
    steps:
      - Brown mushrooms; add leek and carrot.
      - Add lentils, tomatoes and 500 ml water; simmer 45 min.
      - Serve over pasta with grated cheese.

dinners:
  - {day: mon, source: batch, dish_id: squash_chickpea_curry}
  - {day: tue, source: batch, dish_id: roast_veg_tray, assembly: "Fry halloumi, warm veg, make dressing."}
  - {day: wed, source: batch, dish_id: squash_chickpea_curry}
  - {day: thu, source: batch, dish_id: lentil_mushroom_ragu}
  - {day: fri, source: out}
  - {day: sat, source: batch, dish_id: lentil_mushroom_ragu, assembly: "Reheat ragù, boil fresh pasta."}
  - {day: sun, source: leftovers}

