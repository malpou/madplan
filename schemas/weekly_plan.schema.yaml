$schema: https://json-schema.org/draft/2020-12/schema
$id: weekly_plan.schema.yaml
title: Weekly meal plan
description: One file per week, saved as plans/YYYY-Www.yaml (ISO week of the Monday).
type: object
additionalProperties: false
required: [week, status, created, delivery, seasonal_focus, cook_sessions, dishes, dinners, snacks, shopping_list, budget]
properties:
  week: {type: string, pattern: "^[0-9]{4}-W(0[1-9]|[1-4][0-9]|5[0-3])$"}
  status: {type: string, enum: [draft, approved, ordered, done]}
  created: {type: string, format: date}
  delivery:
    type: object
    additionalProperties: false
    required: [date]
    properties:
      date: {type: string, format: date}
      slot: {type: string, description: "e.g. 18:00-20:00"}
  training:
    type: array
    description: Only when the profile has an activity section
    maxItems: 7
    items:
      type: object
      additionalProperties: false
      required: [day, intensity]
      properties:
        day: {$ref: defs.schema.yaml#/$defs/weekday}
        activities: {type: array, items: {type: string}}
        intensity: {type: string, enum: [rest, easy, moderate, hard]}
  seasonal_focus:
    type: array
    minItems: 1
    items: {type: string}
  sale_focus:
    type: array
    description: Nemlig campaigns (valid on the delivery date) the week is built around
    items:
      type: object
      additionalProperties: false
      required: [item, nemlig_product_id, price_dkk, regular_price_dkk, ends]
      properties:
        item: {type: string}
        nemlig_product_id: {type: string}
        price_dkk: {type: number, minimum: 0, description: Campaign price per unit}
        regular_price_dkk: {type: number, minimum: 0}
        min_quantity: {type: integer, minimum: 2, description: Multi-buy offers only}
        ends: {type: string, format: date}
  cook_sessions:
    type: array
    description: Batch cooking sessions; may be empty for households that cook daily
    items:
      type: object
      additionalProperties: false
      required: [id, day, est_minutes, dishes, prep_order]
      properties:
        id: {type: string, pattern: "^s[0-9]+$"}
        day: {$ref: defs.schema.yaml#/$defs/weekday}
        est_minutes: {type: integer, minimum: 1}
        dishes: {type: array, minItems: 1, items: {$ref: "#/$defs/dish_id"}}
        prep_order: {type: array, minItems: 1, items: {type: string}}
  dishes:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, name, cuisine, new, servings, protein_g_per_serving, fridge_days, freezes, ingredients, steps]
      properties:
        id: {$ref: "#/$defs/dish_id"}
        name: {type: string}
        cuisine: {$ref: defs.schema.yaml#/$defs/cuisine}
        new: {type: boolean, description: First time we make this}
        servings: {type: integer, minimum: 1}
        kid_friendly: {type: boolean}
        protein_g_per_serving: {type: number, minimum: 0}
        fridge_days: {type: integer, minimum: 0}
        freezes: {type: boolean}
        source:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type: {type: string, enum: [website, cookbook, own, agent]}
            source_id: {type: string, description: id from data/sources.yaml}
            url: {type: string, format: uri}
            page: {type: integer, minimum: 1}
            adapted: {type: string, description: What we changed (milder, more protein, etc.)}
        rating: {type: integer, minimum: 1, maximum: 5, description: Our rating after eating}
        side_on_the_side: {type: array, items: {type: string}, description: "e.g. chili, served separately"}
        ingredients: {type: array, minItems: 1, items: {$ref: defs.schema.yaml#/$defs/ingredient}}
        steps: {type: array, minItems: 1, items: {type: string}}
  dinners:
    type: array
    maxItems: 7
    items:
      type: object
      additionalProperties: false
      required: [day, source]
      properties:
        day: {$ref: defs.schema.yaml#/$defs/weekday}
        source: {type: string, enum: [batch, fresh, leftovers, out]}
        dish_id: {$ref: "#/$defs/dish_id"}
        assembly: {type: string, description: Weeknight finishing steps, under 15 min}
      allOf:
        - if: {properties: {source: {enum: [batch, fresh]}}}
          then: {required: [dish_id]}
  other_meals:
    type: array
    description: Breakfasts, lunches and packed lunches (madpakker), when the profile plans them
    items:
      type: object
      additionalProperties: false
      required: [meal, days, description]
      properties:
        meal: {type: string, enum: [breakfast, lunch, packed_lunch]}
        days: {type: array, minItems: 1, uniqueItems: true, items: {$ref: defs.schema.yaml#/$defs/weekday}}
        description: {type: string}
        dish_id: {$ref: "#/$defs/dish_id", description: When it reuses a planned dish (e.g. leftovers)}
        ingredients: {type: array, items: {$ref: defs.schema.yaml#/$defs/ingredient}}
  snacks:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, purpose, ingredients]
      properties:
        name: {type: string}
        purpose: {type: string, enum: [pre_run, recovery, everyday]}
        ingredients: {type: array, minItems: 1, items: {$ref: defs.schema.yaml#/$defs/ingredient}}
        prep: {type: string}
        makes: {type: string}
  shopping_list:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [item, quantity, unit, category, organic, price_dkk]
      properties:
        item: {type: string}
        quantity: {type: number, exclusiveMinimum: 0}
        unit: {$ref: defs.schema.yaml#/$defs/unit}
        category: {$ref: defs.schema.yaml#/$defs/category}
        organic: {type: boolean}
        danish: {type: boolean}
        non_organic_reason: {type: string, enum: [no_organic_option, unavailable, budget]}
        nemlig_product_id: {type: string}
        nemlig_name: {type: string}
        price_dkk: {type: number, minimum: 0, description: Line total; campaign price when on_sale}
        on_sale: {type: boolean}
        regular_price_dkk: {type: number, minimum: 0, description: Line total without the campaign}
        in_basket: {type: boolean}
      allOf:
        - if: {properties: {organic: {const: false}}}
          then: {required: [non_organic_reason]}
        - if: {properties: {on_sale: {const: true}}, required: [on_sale]}
          then: {required: [regular_price_dkk]}
  budget:
    type: object
    additionalProperties: false
    required: [limit_dkk, groceries_dkk, delivery_fee_dkk, total_dkk, within_budget]
    properties:
      limit_dkk: {type: number}
      groceries_dkk: {type: number, minimum: 0}
      delivery_fee_dkk: {type: number, minimum: 0}
      total_dkk: {type: number, minimum: 0}
      within_budget: {type: boolean}
      savings_dkk: {type: number, minimum: 0, description: Sum of regular_price_dkk - price_dkk over on_sale items}
  notes: {type: array, items: {type: string}}
$defs:
  dish_id: {type: string, pattern: "^[a-z0-9_]+$"}
